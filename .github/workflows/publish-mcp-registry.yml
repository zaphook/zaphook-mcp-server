name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# Auth: GitHub OIDC, so no secret is stored. The registry grants the io.github.zaphook/*
# namespace because this workflow runs in a repository owned by the zaphook organization.
#
# Run it manually (Actions > Publish to MCP Registry > Run workflow) or push a tag like v1.0.1.
# Bump "version" in server.json before publishing a new release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for GitHub OIDC login

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

env:
  # Pinned release. To upgrade, change both values; the hash comes from
  # registry_<version>_checksums.txt in the same GitHub release.
  MCP_PUBLISHER_VERSION: v1.8.17
  MCP_PUBLISHER_SHA256: 4fbfe8236becd291a7a37b3e2cd7d5a6171ecf25c62a47f4fe92ef9b92007f9b

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check server.json
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open("server.json", encoding="utf-8"))
          assert d["name"] == "io.github.zaphook/zaphook-mcp-server", d["name"]
          assert len(d["description"]) <= 100, "description longer than 100 characters"
          assert d["remotes"][0]["url"] == "https://api.zaphook.cloud/mcp"
          print("server.json ok:", d["name"], d["version"])
          EOF

      - name: Install mcp-publisher (pinned, hash-checked)
        run: |
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o mcp-publisher.tar.gz "$url"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

      - name: Show the listing
        run: |
          sleep 5
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.zaphook/zaphook-mcp-server"
